<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Accueil{% endblock %} – Calculatrice</title>

    <style>
        :root {
            --fond: #edf1f4;
            --surface: #ffffff;
            --encre: #1b2a3a;
            --discret: #566574;
            --bordure: #cbd5de;
            --accent: #2f5d8a;
            --accent-fonce: #234a70;
            --rayon: 6px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--fond);
            color: var(--encre);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }

        a { color: var(--accent); }
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- Navigation ---------- */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--bordure);
        }

        .navbar-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.75rem 1.25rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1.5rem;
        }

        .marque {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--encre);
            text-decoration: none;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 0.25rem;
        }

        .navbar li a {
            display: block;
            padding: 0.4rem 0.9rem;
            border-radius: var(--rayon);
            color: var(--discret);
            text-decoration: none;
        }

        .navbar li a:hover { background: var(--fond); color: var(--encre); }

        .navbar li a[aria-current="page"] {
            background: var(--accent);
            color: #ffffff;
        }

        /* ---------- Contenu ---------- */
        main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.9rem, 4vw, 2.75rem);
            line-height: 1.15;
        }

        h2 { margin: 2.5rem 0 0.75rem; font-size: 1.3rem; }

        p { max-width: 65ch; }

        .bouton {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            border: 0;
            border-radius: var(--rayon);
            background: var(--accent);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .bouton:hover { background: var(--accent-fonce); }

        /* ---------- Pied de page ---------- */
        footer {
            border-top: 1px solid var(--bordure);
            padding: 1rem 1.25rem;
            text-align: center;
            color: var(--discret);
            font-size: 0.9rem;
        }

        @media (max-width: 520px) {
            .navbar ul { width: 100%; }
            .navbar li { flex: 1; }
            .navbar li a { text-align: center; }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <nav class="navbar-inner" aria-label="Navigation principale">
            <a class="marque" href="/">Calculatrice</a>
            <ul>
                <li>
                    <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Accueil</a>
                </li>
                <li>
                    <a href="/calculer" {% if request.path == '/calculer' %}aria-current="page"{% endif %}>Calculer</a>
                </li>
                <li>
                    <a href="/historique" {% if request.path == '/historique' %}aria-current="page"{% endif %}>Historique</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Calculatrice – TP Python</p>
    </footer>
</body>
</html>
